[package]
name = "afterimage-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "afterimage_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi = { version = "0.32.2", features = ["cli"] }
rusqlite = { version = "0.43", features = ["bundled"] }
ureq = { version = "3.5", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
base64 = "0.22"
fastrand = "2"
log = "0.4"
percent-encoding = "2"
url = "2"

[dev-dependencies]
tempfile = "3"
