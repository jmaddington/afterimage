name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          rustup default stable
          scripts/ci/get-create-dmg.sh
          swift --version; cargo --version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            target
            app/.build
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock', 'app/Package.swift') }}

      - name: Engine tests
        run: cargo test --release -p afterimage-core

      - name: Extension
        run: ./scripts/extension.sh

      - name: Release script tests
        run: python3 scripts/ci/test_unpack_app.py

      # Live model tests skip themselves without AFTERIMAGE_LIVE.
      - name: App tests
        run: |
          ./scripts/ffi.sh
          cd app && swift test

      - name: Build app
        run: BUILD=${{ github.run_number }} ./scripts/build.sh

      - name: Package (unsigned smoke test)
        run: ./scripts/package.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Afterimage-unsigned-${{ github.run_number }}
          path: build/dist/*
          retention-days: 7
