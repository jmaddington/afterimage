name: Release

# Push a tag like v0.2.0 to build, sign, notarize and publish a DMG.
# AIDEV-NOTE: three jobs on purpose. Code that came from the network (crates, build scripts, tests) only ever runs in
# AIDEV-NOTE: `build`, which has no secrets; `sign` runs no project code but the packaging scripts; only `publish` can write.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Version
        id: version
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error title=Bad version::'$V' is not semver"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error title=Not on main::Tag a commit that is on main."; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "BUILD=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          rustup default stable

      - name: Tests
        timeout-minutes: 20
        run: |
          cargo test --release -p afterimage-core
          ./scripts/extension.sh
          ./scripts/ffi.sh
          (cd app && swift test)

      - name: Build (unsigned)
        run: |
          ./scripts/build.sh
          ditto -c -k --norsrc --noextattr --keepParent build/Afterimage.app build/Afterimage.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned
          path: |
            build/Afterimage.zip
            build/AppIcon.icns
          retention-days: 1

  sign:
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned

      # AIDEV-NOTE: the archive comes from code that ran network dependencies. It may contain the app and nothing else.
      # AIDEV-NOTE: the archive comes from code that ran network dependencies. It may contain the app and nothing else.
      - name: Unpack
        run: |
          set -euo pipefail
          U="$RUNNER_TEMP/unsigned"
          mkdir "$U/x" build
          /usr/bin/python3 -I scripts/ci/unpack_app.py "$U/Afterimage.zip" Afterimage.app "$U/x"
          mv "$U/x/Afterimage.app" "$U/AppIcon.icns" build/
          [[ -z "$(/usr/bin/git status --porcelain)" ]] || { echo "::error title=Checkout changed::unexpected files"; exit 1; }

      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          scripts/ci/get-create-dmg.sh

      - name: Import signing certificate
        env:
          DEVELOPER_ID_APP_P12: ${{ secrets.DEVELOPER_ID_APP_P12 }}
          DEVELOPER_ID_APP_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_PASSWORD }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: scripts/ci/import-certs.sh

      # AIDEV-NOTE: package.sh silently skips notarization without creds; a release must never ship that.
      - name: Require full signing setup
        run: |
          [[ -n "${AFTERIMAGE_SIGN_IDENTITY:-}" && -n "${NOTARY_KEY_PATH:-}" ]] || {
            echo "::error title=Incomplete signing setup::Need a Developer ID Application identity and the notary API key (ASC_API_KEY_*). Refusing to publish an unnotarized release."
            exit 1; }

      - name: Sign, package, notarize
        timeout-minutes: 40
        run: |
          ./scripts/sign.sh build/Afterimage.app
          ./scripts/package.sh

      - name: Verify
        run: |
          codesign --verify --deep --strict --verbose=2 build/Afterimage.app
          xcrun stapler validate "build/dist/Afterimage-$VERSION.dmg"
          spctl --assess --type open --context context:primary-signature -v "build/dist/Afterimage-$VERSION.dmg"

      - name: Clean up keychain and notary key
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/afterimage-signing.keychain-db" || true; rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: build/dist/*
          retention-days: 7

  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      # Never replaces a published file: a version, once out, stays what it was.
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "v$VERSION" dist/* --verify-tag --title "Afterimage $VERSION" --generate-notes
